# .github/workflows/pipeline-assistant.yml
name: Pipeline Failure Triage

on:
  workflow_run:
    workflows: ["Unit Tests"]   # ← exact name of your existing workflow
    types: [completed]

permissions:
  pull-requests: write   # to post the diagnosis comment
  actions: read          # to read job logs
  contents: read         # to read commit diffs

jobs:
  triage:
    name: Diagnose Failure
    # Only runs when the CI workflow actually failed
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install GitHub Copilot CLI before the action runs
      - name: Install GitHub Copilot CLI
        run: npm install -g @githubnext/github-copilot-cli
      - name: 🤖 Run Pipeline Assistant
        uses: amadalavamsi/pipeline-assistant@v1.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

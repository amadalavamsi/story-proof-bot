# .github/workflows/pipeline-assistant.yml
name: Pipeline Failure Triage

on:
  workflow_run:
    workflows: ["Unit Tests"]   # ← exact name of your existing workflow
    types: [completed]

permissions:
  pull-requests: write   # to post the diagnosis comment
  actions: read          # to read job logs
  contents: read         # to read commit diffs

jobs:
  triage:
    name: Diagnose Failure
    # Only runs when the CI workflow actually failed
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pipeline-assistant action
        uses: actions/checkout@v4
        with:
          repository: amadalavamsi/pipeline-assistant
          path: .pipeline-assistant
      # Install GitHub Copilot CLI
      # NOTE: npm package exposes binary as 'github-copilot-cli', not 'copilot'
      # The symlink below makes `copilot` resolve correctly on the runner PATH
      - name: Install GitHub Copilot CLI
        run: |
          npm install -g @githubnext/github-copilot-cli
          sudo ln -sf "$(which github-copilot-cli)" /usr/local/bin/copilot
          copilot --version

      - name: 🤖 Run Pipeline Assistant
        uses: amadalavamsi/pipeline-assistant@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          agent-command: 'copilot'
          agent-args: '--acp --stdio'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
